name: Release

# Runs when a version tag is pushed: scripts/version.sh patch|minor|major bumps
# chrome/app/manifest.json, commits and tags vX.Y.Z; then `git push --follow-tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react/package-lock.json
      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./chrome/app/manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi
          # Only release reviewed code: the tagged commit must be on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - run: npm ci --prefix react
      - run: npm run build --prefix react
      - name: Zip the extension
        run: cd chrome/app && zip -r -X "$GITHUB_WORKSPACE/apex-debugger-$GITHUB_REF_NAME.zip" . -x '*.DS_Store' '*.map' 'js/build/.gitignore'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "apex-debugger-$GITHUB_REF_NAME.zip" --generate-notes

  chrome-web-store:
    needs: release
    uses: ./.github/workflows/publish-chrome-web-store.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
