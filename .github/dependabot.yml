version: 2
updates:
  # Keeps workflow actions current, including the SHA-pinned
  # google-github-actions/auth in release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm updates, grouped to one PR per directory. Major versions of react/
  # dependencies come in their own group, since they can need code changes.
  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: monthly
    groups:
      react-deps:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
      react-majors:
        applies-to: version-updates
        update-types: ["major"]
        patterns: ["*"]
      react-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e-deps:
        patterns: ["*"]
