version: 2
updates:
  # Keeps workflow actions current, including the SHA-pinned
  # google-github-actions/auth in release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm updates, grouped to one PR per directory.
  # react/ stays on old libraries (material-ui beta, React 16) until the UI
  # migration moves them deliberately, so only patch versions and security
  # fixes are proposed there.
  - package-ecosystem: npm
    directory: /react
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Pinned prerelease: each 1.0.0-beta.N changed APIs.
      - dependency-name: "material-ui"
    groups:
      react-patches:
        applies-to: version-updates
        patterns: ["*"]
      react-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e-deps:
        patterns: ["*"]
